# ══════════════════════════════════════════════════════════════════
# Tell the crawlers, instead of waiting to be found.
#
# A six page site with no inbound links is not crawled on a schedule,
# because there is no schedule to be on: a crawler reaches a new domain
# by following a link to it, and until somebody links here there is no
# link to follow. A sitemap does not fix that — a sitemap is read AFTER
# a crawler has decided to visit, and Google retired its sitemap ping
# endpoint in 2023, so publishing one and waiting is the whole of the
# problem rather than any part of the solution.
#
# IndexNow is the one protocol that runs the other way: the site tells
# the index a URL changed, and the index comes. It is a single POST,
# and it is honoured by Bing, Yandex, Seznam and Naver from one
# submission — they share the feed. Bing is the one that matters most
# here and it is the one people forget: Bing's index is what ChatGPT
# search and Copilot read. Being absent from it is being absent from
# a large share of the answers this brand is trying to appear in.
#
# Google does NOT participate in IndexNow. Nothing in this file affects
# Google, and nothing can: Google is reached through Search Console,
# by hand, once, by a human who owns the domain. See README, step 5.
#
# Authentication is the key file at the repo root, served at
# https://thekaal.co/$KEY.txt and containing exactly $KEY. The index
# fetches it to confirm whoever is submitting controls the host. It is
# not a secret — it is a proof of ownership, and it is public by design.
# ══════════════════════════════════════════════════════════════════
name: indexnow

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', 'llms.txt', 'robots.txt']
  workflow_dispatch:

# write, for one file: the step below commits sitemap.xml back to main when
# its dates have moved. Nothing else in this job writes.
permissions:
  contents: write

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, not the default single commit: every lastmod is read
      # off its own page's history, and in a shallow clone every page's
      # last commit is the only one there is. gen-sitemap refuses to run
      # on one rather than date the whole site to today.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Before anything is announced, the sitemap is made true. Its dates
      # used to be typed by hand and were stale within days. A push by
      # this job's own token starts no workflow, so this cannot loop; the
      # retry is for the sold-sync worker, which also commits to main.
      - name: Date the sitemap from git history
        run: |
          set -euo pipefail
          node tools/gen-sitemap.mjs
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git add sitemap.xml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Date sitemap.xml from git history'
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
            git pull --rebase origin main
          done
          echo "::error::could not push the re-dated sitemap.xml"; exit 1

      # Pages rebuilds from main on its own schedule, and submitting a URL
      # before the new bytes are live just means the crawler reads the old
      # page. Ninety seconds is comfortably longer than this repo's deploy
      # has ever taken.
      - name: Let Pages finish deploying
        run: sleep 90

      # Only what this push changed. Announcing all six pages on every
      # push says six pages changed when one did, and a feed that cries
      # wolf is a feed whose signal gets discounted. A manual run, a first
      # push, or a before-commit this clone cannot see submits everything.
      - name: Submit the URLs this push changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEY=d58a84797445f7170e4c1e15771a7c52
          CHANGED=ALL
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | while read -r loc; do
            f=${loc#https://thekaal.co/}; f=${f:-index.html}
            if [ "$CHANGED" = ALL ] || grep -qxF "$f" <<<"$CHANGED"; then echo "$loc"; fi
          done)
          if [ -z "$URLS" ]; then echo "no page in the sitemap changed in this push"; exit 0; fi
          # jq builds the list and the body. A shell join here is how this
          # step was wrong the first time: `paste -d` cycles through the
          # delimiter's CHARACTERS rather than using the string, so a
          # hand-rolled '","' join silently produces url1"url2,url3 and the
          # endpoint rejects the whole batch.
          BODY=$(printf '%s\n' "$URLS" \
            | jq -R . | jq -s . \
            | jq --arg key "$KEY" '{host:"thekaal.co", key:$key, keyLocation:"https://thekaal.co/\($key).txt", urlList:.}')
          echo "$BODY" | jq .
          CODE=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-raw "$BODY")
          echo "IndexNow returned $CODE"; cat /tmp/out.txt || true
          # 200 accepted. 202 accepted, key still being verified. Both fine.
          case "$CODE" in
            200|202) echo "submitted $(echo "$BODY" | jq '.urlList|length') URL(s)" ;;
            *) echo "::error::IndexNow rejected the submission ($CODE)"; exit 1 ;;
          esac
