<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not here &middot; KAAL</title>
<!-- A 404 that gets indexed is a 404 competing with the pages that matter.
     GitHub Pages serves this file for every unmatched path on the custom
     domain, and it returns a real 404 status while doing it, which is the
     part that keeps it out of the index in the first place. This is belt
     and braces. -->
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#080908">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--void:#080908;--bone:#EDE8DF;--mute:#B3AC9F;--faint:#9D968A;--line:#221F1C;--gold:#C6A15B}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--void);color:var(--bone);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;line-height:1.65;
    display:grid;place-items:center;padding:2rem;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;text-align:center}
  .mark{font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin:0 0 1.8rem}
  h1{font-family:'Times New Roman',serif;font-weight:400;letter-spacing:-.02em;
    font-size:clamp(1.9rem,1.3rem + 2.6vw,3rem);line-height:1.08;margin:0 0 1.1rem}
  p{color:var(--mute);margin:0 0 1.9rem}
  nav{border-top:1px solid var(--line);padding-top:1.6rem;display:flex;flex-wrap:wrap;
    gap:.6rem 1.5rem;justify-content:center;font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase}
  nav a{color:var(--faint);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:.2rem}
  nav a:hover,nav a:focus-visible{color:var(--bone);border-color:var(--gold)}
  .go{display:inline-block;background:var(--bone);color:var(--void);text-decoration:none;
    padding:.95rem 2rem;border-radius:2px;font-size:.8125rem;letter-spacing:.15em;text-transform:uppercase;
    margin-bottom:2.4rem;transition:background-color .35s ease}
  .go:hover,.go:focus-visible{background:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="mark">KAAL</p>
  <h1>This page was never made, or is no longer made</h1>
  <p>Which, for a brand that retires things on purpose, is at least in character. The twenty are still where they were.</p>
  <a class="go" href="/">See the twenty</a>
  <nav aria-label="The rest of the site">
    <a href="/movement.html">The movement</a>
    <a href="/provenance.html">Provenance</a>
    <a href="/manifesto.html">Why twenty</a>
    <a href="/about.html">About</a>
    <a href="/legal.html">Legal</a>
  </nav>
</main>
</body>
</html>
