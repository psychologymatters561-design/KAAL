<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAAL &middot; Follow your piece</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080908">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://kaal-edition.kaal-edition-hq.workers.dev data:; connect-src https://kaal-edition.kaal-edition-hq.workers.dev; base-uri 'none'; form-action 'none'">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/InstrumentSerif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/owners.css">
</head>
<body>
<a class="skip" href="#main">Skip to the journey</a>
<main id="main">
  <div class="wrap">
    <p class="mark"><a href="/">KAAL</a></p>

    <!-- The journey, once an order is found -->
    <section id="found" hidden aria-live="polite">
      <div class="piece" id="piece"></div>
      <h1 class="center" id="headline">Its journey</h1>
      <ol class="tl" id="timeline" aria-label="Where it is"></ol>
      <div id="after"></div>
    </section>

    <!-- Or ask for it -->
    <section id="ask">
      <h1>Follow your piece</h1>
      <p class="muted">Enter the order reference from your payment receipt and the email you paid with. The link in any of our emails opens this page directly, with nothing to type.</p>
      <form id="form" novalidate>
        <label for="ref">Order reference</label>
        <input id="ref" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pay_… or order_… or the number, like 07" required>
        <label for="email">Email you paid with</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
        <p class="err" id="err" role="alert"></p>
        <button class="btn block" id="go" type="submit">Follow it</button>
      </form>
    </section>

    <footer class="fine">Questions: <a href="mailto:connect@thekaal.co">connect@thekaal.co</a></footer>
  </div>
</main>
<script src="assets/owners.js"></script>
<script src="assets/track.js"></script>
</body>
</html>
