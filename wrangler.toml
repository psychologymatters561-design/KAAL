# The worker deploys as it is: no bundler, no build step, same as the site.
#   wrangler deploy
name = "kaal-edition"
main = "worker/kaal-sold-sync.js"
compatibility_date = "2026-09-19"

[vars]
GITHUB_OWNER  = "psychologymatters561-design"
GITHUB_REPO   = "KAAL"
GITHUB_BRANCH = "main"
EDITION       = "20"
CURRENCY      = "INR"

# What a watch costs, in paise, and the only place /order will read it
# from. A browser can ask for a number; it cannot ask for a price.
#
# This is a second copy of `price` in index.html and it is kept honest
# the same way the ItemList is: tools/check.mjs fails the build if the
# two ever disagree. Change the price on the page and this line and the
# deployed secret have to move with it — in that order, and before the
# next sale.
PRICE_PAISE   = "599900"          # ₹5,999

ALLOW_ORIGIN  = "https://thekaal.co,https://www.thekaal.co"

# Every sale emails the owner and the buyer (docs/setup-email.md). The
# verified sender, where buyers' replies go, and the site the buyer is sent
# back to. The owner's own inbox is a SECRET (OWNER_EMAIL, below), so a
# personal address never appears in this public file.
MAIL_FROM     = "KAAL <connect@thekaal.co>"
MAIL_REPLY_TO = "connect@thekaal.co"
SITE_URL      = "https://thekaal.co"
# This worker's own address, for the desk link in the daily report.
WORKER_URL    = "https://kaal-edition.kaal-edition-hq.workers.dev"

# Which dial each number carries, for the sale emails. A mirror of
# KAAL.dials in index.html; tools/check.mjs fails the build if they differ.
DIALS = '{"1":"Emerald","2":"Emerald","3":"Emerald","4":"Emerald","5":"Emerald","6":"Emerald","7":"Midnight","8":"Midnight","9":"Midnight","10":"Midnight","11":"Champagne","12":"Champagne","13":"Champagne","14":"Champagne","15":"Ivory","16":"Ivory","17":"Ivory","18":"Ivory","19":"Ivory","20":"Ivory"}'

# The one email after an unfinished checkout. Built and OFF. Read
# docs/email.md before turning it on; "on" is the only value that sends.
ABANDON_EMAIL = "off"

# The owner's end-of-day report (worker section 5): the day's visitors,
# add-to-carts, checkouts, orders, unfinished checkouts and Series 02 leads,
# emailed to OWNER_EMAIL (connect@thekaal.co unless set). It goes in the
# first half hour of DIGEST_HOUR_IST, India time, about the day before:
# "0" is just after midnight, the full day; "9" would be the next morning.
# "off" stops it.
DIGEST          = "on"
DIGEST_HOUR_IST = "0"

# The instant "New order" email to the owner, the moment a payment lands.
# The buyer's own confirmation always goes. "off" leaves only the daily report.
ORDER_ALERT     = "on"

# Refunds are found on their own: every half hour the worker asks Razorpay
# (at once, if the Razorpay webhook also sends refund.processed), records
# each one once and emails the owner. A full refund never puts the number
# back on sale; the desk asks. The buyer also gets KAAL's own refund email;
# "off" leaves them with Razorpay's notice alone.
REFUND_EMAIL    = "on"
# ABANDON_FROM  = "KAAL <connect@thekaal.co>"   # a sender your provider has verified

# Where and when a number went, shown under it in the register ONLY with
# the buyer's consent. JSON, number to one short line. The KV key `placed`
# wins over this when both exist. Leave it out to show nothing.
# PLACED = '{"1":"Delhi · Sep 2026"}'

# Secrets are never written here. Set them once, each on its own:
#   wrangler secret put RAZORPAY_KEY_ID        publishable; the worker
#                                              hands it to the browser
#                                              at order time so that no
#                                              Razorpay key ever lands
#                                              in the repo (check.mjs
#                                              fails the build if one does)
#   wrangler secret put RAZORPAY_KEY_SECRET    signs orders, verifies
#                                              payments, never leaves here
#   wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   wrangler secret put GITHUB_TOKEN
#
# Optional — Meta Conversions API. With both set, every captured payment is
# also sent to Meta server-side as a Purchase, de-duplicated against the
# browser Pixel by the Razorpay payment id. Without them nothing is sent.
#   wrangler secret put META_PIXEL_ID          same ID as assets/tags.js
#   wrangler secret put META_CAPI_TOKEN        Events Manager → Settings →
#                                              Conversions API → Generate
#                                              access token
# The order emails (docs/setup-email.md). tools/setup-email.sh sets both:
#   wrangler secret put RESEND_API_KEY         sends every email the shop sends
#   wrangler secret put OWNER_EMAIL            where new orders and addresses
#                                              go; several allowed, comma
#                                              separated. Without it, they go
#                                              to connect@thekaal.co
# (BREVO_API_KEY works instead of Resend; Resend wins if both are set.)
# The owner's private desk, <worker>/desk (docs/desk.md). Shut until set:
#   wrangler secret put DESK_PASSCODE          ten characters or more;
#                                              changing it signs every
#                                              device out
# Optional — a salt for the Series 02 list's rate limiter, so its hashed
# IP keys cannot be reversed by trying every address:
#   wrangler secret put LIST_SALT
#
# To test, set META_TEST_EVENT_CODE (Events Manager → Test events) and
# remove it again afterwards. META_API_VERSION overrides the Graph API
# version (default v23.0).
#
# Locally, `wrangler dev` reads the same names out of .dev.vars, which is
# gitignored. Copy .dev.vars.example to start.

# Holds live in KV. Create the namespace once, paste the id it prints
# below, and uncomment the block:
#   wrangler kv namespace create KAAL_STATE
#
# Until then the worker deploys and runs exactly as it did before holds
# existed: the webhook still records sales, /state answers "no opinion",
# and the page trusts its own array.
#
[[kv_namespaces]]
binding = "KAAL_STATE"
id = "574516a441944b5cba9f34d9b73527e4"
#
# The Series 02 list (POST /list) and the abandoned-checkout email both live
# in this namespace too. Until it exists, /list answers "no-store" and the
# page says "That did not reach us" — so create it before the list matters.

# The daily count behind the morning report: one Durable Object holding a
# tally per day. SQLite-backed, so it runs on Cloudflare's free plan, whose
# allowance (100,000 writes a day) is far above this shop's traffic; KV's free
# allowance (1,000 writes a day) is not. Created on the first deploy.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

# Every thirty minutes the worker looks for unfinished checkouts. With
# ABANDON_EMAIL off it returns before doing anything, so this costs nothing
# while the feature is off.
[triggers]
crons = ["*/30 * * * *"]
