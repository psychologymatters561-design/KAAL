# ══════════════════════════════════════════════════════════════════
# The push is the deploy. GitHub Pages rebuilds from main within about
# a minute, so anything wrong in a commit is in front of paid traffic
# before anyone has finished reading the commit message.
#
# This is the gate. It installs nothing — the repository has no npm and
# no build step, and a CI job that needs a lockfile to check a static
# page would be a worse version of the problem it claims to solve. It
# runs one script with Node's own standard library, in about a second.
# ══════════════════════════════════════════════════════════════════
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate the page
        run: node tools/check.mjs

      - name: Test what is left, for readers that run no script (worker/stock.js)
        run: node tools/test-stock.mjs

      - name: Validate the worker parses
        run: for f in worker/*.js; do node --check "$f" || exit 1; done

      - name: Test the money path (payment return, receipt, address, emails, the desk)
        run: node tools/test-worker.mjs

      - name: Test the registry (migrations/, holds, a payment twice, a duplicate's refund, staging)
        run: node --no-warnings tools/test-registry.mjs

      - name: Test the control room (sign-in, authenticator, stages and their emails, refunds, outbox)
        run: node --no-warnings tools/test-control.mjs

      - name: Test going live (the import, past sales, the off switch)
        run: node --no-warnings tools/test-live.mjs

      - name: Test orders in motion (the Placed letter, /track, the courier, late orders and the reminder)
        run: node --no-warnings tools/test-ops.mjs

      - name: Test owners (registering, signing in, the dossier, the public registry)
        run: node --no-warnings tools/test-owners.mjs

      - name: Test what owners ask for (claims, uploads, stolen, transfers, recovery, Approvals)
        run: node --no-warnings tools/test-requests.mjs
