# ══════════════════════════════════════════════════════════════════
# Switch the worker on from a phone: no computer, no terminal.
#
# GitHub's own machine runs tools/setup-email.mjs, the same command that
# docs/setup-email.md describes, with these repository secrets
# (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" token
#   RESEND_API_KEY         Resend key with Full access
#   DESK_PASSCODE          optional; without it, one is made and emailed
#                          to connect@thekaal.co
#   ANTHROPIC_API_KEY      optional; Claude writes each nearly-bought note from
#                          the visitor's own visit (docs/followups.md)
#   META_CAPI_TOKEN        optional; Meta Conversions API token, so every
#                          paid order reaches the ad account from the
#                          worker (docs/meta.md). Modes deploy and all set it
#   SHIPROCKET_TOKEN       optional; any text of 12+ characters, the same as the
#                          security token you give Shiprocket's webhook, so
#                          Dispatched and Delivered happen by themselves
#                          (docs/courier.md). Modes deploy and live set it
#   CLOUDFLARE_ACCOUNT_ID  optional; only if the token sees several accounts
#
# Mode "staging" (the registry build, docs/staging.md) also needs:
#   RAZORPAY_TEST_KEY_ID          rzp_test_..., Razorpay in Test Mode → API Keys
#   RAZORPAY_TEST_KEY_SECRET      shown once beside it
#   RAZORPAY_TEST_WEBHOOK_SECRET  any long random text; the same goes into the
#                                 Razorpay TEST webhook
#   ADMIN_EMAIL                   optional: who may sign in to /control (else the
#                                 first OWNER_EMAIL, else connect@thekaal.co)
# and a CLOUDFLARE_API_TOKEN that can also edit D1.
#
# It runs only when someone with write access presses "Run workflow" (or
# asks Claude to). Never on a push or a pull request, so no fork and no
# outside contribution can reach the secrets. This repository is public
# and so are these logs: the script never prints a key or the passcode,
# and GitHub blanks out the secrets' values in logs regardless.
#
# If the run creates the worker's store, the store's id (not a secret)
# is committed back to wrangler.toml, so every later deploy keeps it.
# ══════════════════════════════════════════════════════════════════
name: setup-worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy: put the latest worker live (after a change) · all: first-time setup, everything not yet done · check: only report · test: send the sample emails again · staging: the registry's test-mode staging worker · live: the registry on the LIVE shop (docs/registry-live.md), also deploys and sets the Meta token"
        type: choice
        options: [deploy, all, check, test, staging, live]
        default: deploy

permissions:
  contents: write

concurrency:
  group: setup-worker
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run the setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DESK_PASSCODE: ${{ secrets.DESK_PASSCODE }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHIPROCKET_TOKEN: ${{ secrets.SHIPROCKET_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
          RAZORPAY_TEST_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            check) node tools/setup-email.mjs --check ;;
            test)  node tools/setup-email.mjs --test ;;
            staging) node tools/setup-email.mjs --staging ;;
            live)  node tools/setup-email.mjs --live ;;
            all)   node tools/setup-email.mjs ;;
            *)     node tools/setup-email.mjs --deploy ;;
          esac

      - name: Keep the store's id in wrangler.toml
        if: ${{ inputs.mode == 'all' || inputs.mode == 'deploy' || inputs.mode == 'staging' || inputs.mode == 'live' }}
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if git diff --quiet -- wrangler.toml; then echo "wrangler.toml unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "Bind the worker's stores in wrangler.toml (setup-worker run, mode $MODE)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
