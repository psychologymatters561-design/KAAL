<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAAL &middot; Accept a piece</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080908">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://kaal-edition.kaal-edition-hq.workers.dev data:; connect-src https://kaal-edition.kaal-edition-hq.workers.dev; base-uri 'none'; form-action 'none'">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/InstrumentSerif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/owners.css">
</head>
<body>
<a class="skip" href="#main">Skip to the form</a>
<main id="main">
  <div class="wrap">
    <p class="mark"><a href="/">KAAL</a></p>

    <!-- 1. The code that came with the watch -->
    <section id="s1">
      <h1>Accept a piece</h1>
      <p class="muted">Someone is passing a KAAL on to you. Enter the code that came with the watch and its letter.</p>
      <form id="fCode" novalidate>
        <label for="code">The transfer code</label>
        <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE-FGHJK" required>
        <p class="err" id="e1" role="alert"></p>
        <button class="btn block" id="go1" type="submit">Continue</button>
      </form>
    </section>

    <!-- 2. Who you are -->
    <section id="s2" hidden>
      <div class="piece" id="piece"></div>
      <h1 class="center" id="title">Accept</h1>
      <p class="muted center" id="lead"></p>
      <form id="reg" novalidate>
        <label for="name">Your name, as it should be written</label>
        <input id="name" type="text" autocomplete="name" required>
        <label for="phone">Phone</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" required>
        <label for="email">Email <span class="faint">(this is how you sign in)</span></label>
        <input id="email" type="email" inputmode="email" autocomplete="email" required>
        <div class="row"><button class="btn ghost" id="send" type="button">Send me a code</button></div>
        <p class="hint" id="sendMsg" role="status"></p>
        <label for="ecode">The six digits we emailed you</label>
        <input id="ecode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" class="short">
        <label for="city">City <span class="faint">(optional)</span></label>
        <input id="city" type="text" autocomplete="address-level2">
        <label for="state">State <span class="faint">(optional)</span></label>
        <input id="state" type="text" autocomplete="address-level1">

        <div class="notice" id="notice"></div>
        <label class="check" for="accept"><input id="accept" type="checkbox"><span id="acceptText"></span></label>
        <label class="check" for="showCity"><input id="showCity" type="checkbox"><span>Show my city beside this number in the public registry.<small>Optional, and only if you entered a city. Otherwise the registry says &ldquo;Owner&rsquo;s city withheld&rdquo;.</small></span></label>
        <label class="check" for="consent"><input id="consent" type="checkbox"><span>I have read the <a href="/legal.html#data" target="_blank" rel="noopener">data notice</a> and agree to KAAL keeping my details to run my warranty and my place in the registry.</span></label>

        <p class="err" id="e2" role="alert"></p>
        <button class="btn block" id="go2" type="submit">Accept</button>
        <p class="center"><button class="linkbtn" id="back" type="button">Use a different code</button></p>
      </form>
    </section>

    <!-- 3. Done, or waiting -->
    <section id="s3" hidden aria-live="polite">
      <h1 class="center" id="doneH"></h1>
      <p class="muted center" id="doneP"></p>
      <p class="center"><a class="btn" href="/owners">Open Owners</a></p>
    </section>

    <footer class="fine">Questions: <a href="mailto:connect@thekaal.co">connect@thekaal.co</a></footer>
  </div>
</main>
<script src="/assets/owners.js"></script>
<script src="/assets/transfer.js"></script>
</body>
</html>
